<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GAB暗記ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* マークシートの紙と朱色の印刷インク。選んだ答えは鉛筆で塗りつぶす。1カラム、PCでは記録を右に並べる */
:root{
  --paper:#F5F6F3;
  --sheet:#FFFFFF;
  --ink:#23262C;
  --muted:#686C74;
  --rule:#E6D3CB;
  --mark:#D4542E;
  --mark-soft:#F8E3DA;
  --ok:#2C7A57;
  --ok-soft:#DFF0E7;
  --ng:#B83A2E;
  --ng-soft:#F7DFDB;
  --warn:#9A6A12;
  --warn-soft:#F6EBD3;
  --lv0:#D9DBD7; --lv1:#E0907A; --lv2:#E9C27A; --lv3:#8FBFA4; --lv4:#2C7A57;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18191C; --sheet:#212327; --ink:#ECE9E4; --muted:#A3A39F; --rule:#3B3431;
    --mark:#EE7A52; --mark-soft:#3A2A24; --ok:#6CC59A; --ok-soft:#1F3229; --ng:#F0877A; --ng-soft:#3A2522;
    --warn:#E5B95C; --warn-soft:#352D1E;
    --lv0:#3A3C40; --lv1:#9C5544; --lv2:#9C8048; --lv3:#4E7F65; --lv4:#6CC59A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18191C; --sheet:#212327; --ink:#ECE9E4; --muted:#A3A39F; --rule:#3B3431;
  --mark:#EE7A52; --mark-soft:#3A2A24; --ok:#6CC59A; --ok-soft:#1F3229; --ng:#F0877A; --ng-soft:#3A2522;
  --warn:#E5B95C; --warn-soft:#352D1E;
  --lv0:#3A3C40; --lv1:#9C5544; --lv2:#9C8048; --lv3:#4E7F65; --lv4:#6CC59A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}

/* header: マークシートの左端のタイミングマーク */
header.top{position:relative;padding:18px 16px 14px 34px;max-width:1080px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top::before{content:"";position:absolute;left:12px;top:18px;bottom:14px;width:10px;
  background:repeating-linear-gradient(to bottom,var(--ink) 0 4px,transparent 4px 10px);opacity:.85}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:28px;font-weight:900;letter-spacing:.04em;line-height:1.1}
.brand h1 span{color:var(--mark)}
.brand small{color:var(--muted);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--sheet)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--lv0);display:inline-block}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--ng)}
.rule2{height:0;border-top:2px solid var(--mark);border-bottom:1px solid var(--mark);padding-top:2px;max-width:1080px;margin:0 auto 18px}

/* home */
.home{display:grid;gap:20px}
@media (min-width:960px){.home{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.panel h2{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.panel h2 .mono{font-size:12px;color:var(--mark);font-weight:600}
.subjects{display:grid;gap:10px}
.subj{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);cursor:pointer;text-align:left;width:100%}
.subj[aria-pressed="true"]{border-color:var(--mark);box-shadow:inset 0 0 0 1px var(--mark)}
.subj .nm{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em}
.subj .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj .bar{grid-column:1 / -1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--lv0)}
.bar b{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;min-height:48px;text-align:center}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.mark{border-color:var(--mark);color:var(--mark)}
.btn.ghost{border-color:var(--rule);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.8}
.opts{display:grid;gap:12px;margin-top:14px}
.opt label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--mark-soft);border-color:var(--mark);color:var(--mark);font-weight:700}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--mark)}
.hint{font-size:12px;color:var(--muted)}
.pool{font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.pool b{color:var(--ink)}

.log{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.log td,.log th{padding:6px 4px;border-bottom:1px dashed var(--rule);text-align:right}
.log th{font-weight:500;color:var(--muted);font-size:12px}
.log td:first-child,.log th:first-child{text-align:left;font-family:var(--f-mono);font-size:13px}
.weak{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.weak li{font-size:14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline}
.weak .id{font-family:var(--f-mono);font-size:12px;color:var(--mark)}
.weak .x{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .btn{flex:1 1 140px;font-size:14px;min-height:42px;padding:8px 10px}

/* theme picker */
.picker{display:grid;gap:6px;max-height:52vh;overflow:auto;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper)}
.picker label{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;font-size:14px;padding:6px;border-radius:6px;background:var(--sheet)}
.picker .id{font-family:var(--f-mono);font-size:12px;color:var(--mark);min-width:44px}
.picker .mini{width:54px;height:6px}
.picker .grp{font-size:12px;color:var(--muted);padding:6px 4px 2px;font-weight:700}

/* study screen */
.study{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 20px)}
.sbar{display:flex;align-items:center;gap:10px;font-size:14px}
.sbar .count{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sbar .prog{flex:1;height:6px;background:var(--lv0);border-radius:3px;overflow:hidden}
.sbar .prog b{display:block;height:100%;background:var(--mark)}
.sbar .quit{border:none;background:none;color:var(--muted);cursor:pointer;padding:8px;font-size:14px}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 16px;display:grid;gap:12px;position:relative}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.qmeta .id{font-family:var(--f-mono);color:var(--mark);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;border:1px solid currentColor}
.chip.warn{color:var(--warn);background:var(--warn-soft)}
.chip.lv{color:var(--muted)}
.theme{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.5;border-left:3px solid var(--mark);padding-left:10px}
.qtext{font-size:20px;font-weight:500;line-height:1.65}
.qtext.en{font-size:19px}
.rel{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px}
.marks{display:inline-flex;gap:3px;vertical-align:middle}
.marks i{width:9px;height:14px;border-radius:50%;border:1.5px solid var(--mark);display:inline-block}
.marks i.on{background:var(--ink);border-color:var(--ink)}

/* choices */
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px;font-size:16px}
@media (hover:hover){.choice:not([disabled]):hover{border-color:var(--mark)}}
.bub{width:30px;height:42px;border-radius:50%;border:2px solid var(--mark);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--mark);font-size:15px;flex:none}
.choice .lbl b{display:block;font-weight:700}
.choice .lbl small{display:block;font-size:12px;color:var(--muted)}
.choice.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.wrong .bub{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.choice[disabled]{cursor:default}
.abc{grid-template-columns:repeat(3,1fr)}
.abc .choice{grid-template-columns:1fr;justify-items:center;text-align:center;padding:12px 8px}
.g4{display:grid;gap:8px}
.g4row{display:grid;grid-template-columns:52px repeat(3,1fr);gap:8px;align-items:center}
.g4row .n{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.g4row button{border:2px solid var(--mark);background:var(--sheet);color:var(--mark);border-radius:999px;height:46px;font-family:var(--f-mono);font-weight:600;font-size:17px;cursor:pointer}
.g4row button.sel{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.g4row button.right{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.g4row button.wrong{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.g4row button.miss{border-color:var(--ok);color:var(--ok);border-style:dashed}

/* feedback */
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:10px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.ng{background:var(--ng-soft);border-color:var(--ng)}
.fb .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fb .head strong{font-family:var(--f-display);font-size:22px;font-weight:900}
.fb.ok .head strong{color:var(--ok)}
.fb.ng .head strong{color:var(--ng)}
.fb .lvchg{font-size:13px;color:var(--muted)}
.ans{font-size:16px}
.ans .k{font-size:12px;color:var(--muted);display:block}
.detail{display:grid;gap:8px;font-size:14px}
.split{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.split h3{font-size:14px;color:var(--warn);margin-bottom:6px}
.split table{width:100%;border-collapse:collapse;font-size:13px}
.split td{padding:4px 6px;border-top:1px dashed var(--rule);vertical-align:top}
.split td:first-child{font-weight:700;white-space:nowrap;font-family:var(--f-mono)}
.note{color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:700}
.actions{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,transparent);display:grid;gap:8px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{min-height:56px}
.rate .r1{border-color:var(--ng);color:var(--ng)}
.rate .r2{border-color:var(--warn);color:var(--warn)}
.rate .r3{border-color:var(--ok);color:var(--ok)}
.kbd{display:none;font-size:12px;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--sheet)}

/* flashcard */
.flip{cursor:pointer;min-height:220px;align-content:start}
.flip .tap{font-size:13px;color:var(--muted);text-align:center;padding-top:8px;border-top:1px dashed var(--rule)}
.back{display:grid;gap:10px;border-top:2px solid var(--mark);padding-top:12px}
.back .big{font-size:22px;font-weight:700}
.back .big.mono{letter-spacing:.2em}

/* result */
.score{font-family:var(--f-display);font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted)}
.missed{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.missed li{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
.missed .id{font-family:var(--f-mono);font-size:12px;color:var(--mark)}

/* dialog */
.dlg{position:fixed;inset:0;background:rgba(20,20,22,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg .box{background:var(--sheet);border-radius:12px;padding:18px;max-width:560px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto}
.dlg textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.dlg .row .btn{flex:1 1 120px}
.msg{font-size:13px;color:var(--ok)}
.msg.err{color:var(--ng)}
@media (max-width:520px){
  .brand small{display:none}
  header.top{padding-top:14px;padding-bottom:10px;align-items:center}
  .brand h1{font-size:24px}
  .qtext{font-size:18px}
  .abc .choice{padding:10px 4px}
}
@media (prefers-reduced-motion:no-preference){
  .fb,.back{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}

/* nav */
.tabs{max-width:1080px;margin:0 auto 14px;padding:0 16px;display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.tabs button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.gate{max-width:520px;margin:24px auto;display:grid;gap:12px}
.gate p{margin:0}
.input{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);min-height:46px}
.row{display:flex;gap:8px;align-items:stretch}
.row .input{flex:1}
.link{border:none;background:none;color:var(--mark);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.l{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.sub{font-size:15px;font-weight:700;margin:0 0 8px}
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:14px}
.board li.me{border-color:var(--mark);background:var(--mark-soft)}
.board .rk{color:var(--mark);font-weight:600;text-align:center}
.board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.board .nm small{font-weight:500;color:var(--muted)}
.board .sb{font-size:12px;color:var(--muted);white-space:nowrap}
.board .vl{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.board li.empty{display:block;color:var(--muted)}
.live .board{margin:0}
.live .board li{padding:6px 10px;font-size:13px}
.roomcode{font-size:44px;font-weight:600;letter-spacing:.25em;color:var(--mark);margin:2px 0 8px}
.center{text-align:center}
.countdown{font-size:96px;font-weight:600;line-height:1;color:var(--mark);margin:12px 0}
.verdict{font-family:var(--f-display);font-weight:900;font-size:40px;margin:4px 0 8px}
.verdict.w{color:var(--ok)} .verdict.l{color:var(--ng)} .verdict.d{color:var(--warn)}
.admin{margin-top:18px;border-top:2px dashed var(--rule);padding-top:14px;display:grid;gap:8px}
.admin h3{font-size:15px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>GAB<span>暗記</span>ノート</h1>
    <small>言語・非言語・英語の解答集を、クイズと暗記カードで覚える</small>
  </div>
  <span class="sync" id="sync" data-s="local" hidden><i></i><span id="syncText">接続中…</span></span>
</header>
<div class="rule2"></div>
<nav class="tabs" id="nav" hidden aria-label="メニュー"><button type="button" data-nav="home">勉強</button><button type="button" data-nav="rank">ランキング</button><button type="button" data-nav="battle">対決</button><button type="button" data-nav="settings">設定</button></nav>
<main class="wrap" id="app"><div class="gate panel"><p class="empty">読み込み中…</p></div></main>
<div id="dlg"></div>
<div class="flash" id="flash" hidden role="status"></div>
<script type="module">
import * as FA from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import * as FAU from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import * as FS from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const FB = Object.assign({}, FA, FAU, FS);
const firebaseConfig = {
  apiKey: "AIzaSyAeDCsv-FztLJhsA8Ke3thPLggUD8PcpfY",
  authDomain: "gab-anki-265f7.firebaseapp.com",
  projectId: "gab-anki-265f7",
  storageBucket: "gab-anki-265f7.firebasestorage.app",
  messagingSenderId: "758109583773",
  appId: "1:758109583773:web:ea14cf6bffd3598b28d774"
};
const fbApp = FB.initializeApp(firebaseConfig);
const auth = FB.getAuth(fbApp);
const db = FB.getFirestore(fbApp);
let THEMES = [], ITEMS = [], BYID = {}, IDX = new Map();
function setData(d){ THEMES = d.themes; ITEMS = d.items; BYID = {}; ITEMS.forEach(it => BYID[it.i] = it); IDX = new Map(ITEMS.map((it, k) => [it, k])); }
const SUBJ = {L:'言語', N:'非言語', E:'英語'};
const LV = ['未学習','まだ','うろ覚え','覚えた','完璧'];
const ABC = {A:['正しい','本文から明らかに正しい'], B:['誤り','本文から明らかに誤り'], C:['判断できない','本文だけでは判断できない']};
const STLBL = ['', '解答集に迷い・別解の記載あり', '解答集1件のみの答え', '解答集で答えが割れている問題'];
let KEY = 'gabmemo.v2';

/* ---------- utils ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function today(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function noKey(id){ const m = id.slice(1).split('-'); return m.map(x => isNaN(+x) ? x : (+x)); }
function cmpId(a,b){ const x=noKey(a), y=noKey(b); for(let i=0;i<Math.max(x.length,y.length);i++){ if(x[i]===undefined) return -1; if(y[i]===undefined) return 1; if(x[i]<y[i]) return -1; if(x[i]>y[i]) return 1; } return 0; }
const isEN = it => it.s === 'E';
const dispId = it => it.i.slice(1);

/* ---------- progress state ---------- */
let P = blank();
function blank(){ return {v:2, items:{}, log:{}, recent:[], battles:{}, set:{subj:'L', scope:'todo', count:20, order:'random', done:false, themes:{}}, t:0}; }
function load(){
  try{ const s = localStorage.getItem(KEY); if(s){ const o = JSON.parse(s); if(o && o.items) return Object.assign(blank(), o, {set:Object.assign(blank().set, o.set||{})}); } }catch(e){}
  return blank();
}
function save(){ P.t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} Cloud.schedule(); }
function rec(id){ return P.items[id] || {l:0,q:0,k:0,n:0,c:0,t:0}; }
function lv(id){ return (P.items[id]||{}).l || 0; }
function logToday(ok){ const d = today(); const g = P.log[d] || {n:0,c:0}; g.n++; if(ok) g.c++; P.log[d] = g; }

function applyQuiz(it, ok){
  const r = Object.assign({}, rec(it.i)); const before = r.l;
  r.n++; if(ok){ r.c++; r.q = (r.q||0)+1; r.l = r.q >= 2 ? 4 : Math.max(r.l, 3); }
  else { r.q = 0; r.l = 1; }
  r.t = Date.now(); P.items[it.i] = r; logToday(ok); P.recent = (P.recent || []).concat(ok ? 1 : 0).slice(-50); save();
  return [before, r.l];
}
function applyCard(it, grade){ // 1 わからない, 2 うろ覚え, 3 覚えた
  const r = Object.assign({}, rec(it.i)); const before = r.l;
  if(grade === 1){ r.l = 1; r.q = 0; r.k = 0; }
  else if(grade === 2){ r.l = 2; r.q = 0; r.k = 0; }
  else {
    r.k = (r.k||0) + 1;
    if(it.k === 'card') r.l = r.k >= 2 ? 4 : Math.max(r.l, 3);
    else r.l = Math.max(r.l, 3);
  }
  r.t = Date.now(); P.items[it.i] = r; save();
  return [before, r.l];
}

/* ---------- cloud sync (Firebase) ---------- */
const Cloud = {
  uid:null, busy:false, dirty:false, timer:null, lastProfile:'',
  set(s, text){ const el = document.getElementById('sync'); if(!el) return; el.hidden = false; el.dataset.s = s; document.getElementById('syncText').textContent = text; },
  schedule(){ if(!this.uid) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 2000); },
  async flush(){
    if(!this.uid || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false; this.set('saving', '保存中…');
    try{
      await FB.setDoc(FB.doc(db, 'progress', this.uid), {v:2, items:P.items, log:P.log, recent:P.recent || [], battles:P.battles || {}, set:P.set, t:P.t});
      await this.pushProfile(false);
      this.set('synced', '保存済み');
    }catch(e){ console.error(e); this.dirty = true; this.set('error', '保存に失敗（再試行します）'); setTimeout(() => this.flush(), 5000 + Math.random() * 3000); }
    this.busy = false; if(this.dirty) this.schedule();
  },
  async pushProfile(force){
    if(!this.uid || !ME.name) return;
    const body = {name:ME.name, public:!!ME.public, stats:computeStats(), updated:Date.now()};
    const key = JSON.stringify([body.name, body.public, body.stats]);
    if(!force && key === this.lastProfile) return;
    await FB.setDoc(FB.doc(db, 'profiles', this.uid), body);
    this.lastProfile = key;
  },
  async pull(){
    if(!this.uid) return;
    try{
      const snap = await FB.getDoc(FB.doc(db, 'progress', this.uid));
      if(snap.exists()){ if(merge(snap.data())){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} if(!S.session) render(); } }
      this.set('synced', '保存済み');
    }catch(e){ console.error(e); this.set('error', '同期できません（この端末に保存）'); }
  }
};
function merge(o){
  if(!o || typeof o !== 'object' || !o.items) return false;
  let changed = false, localNewer = false;
  for(const id in o.items){ const r = o.items[id]; if(!BYID[id] || !r) continue; const l = P.items[id]; if(!l || (r.t||0) > (l.t||0)){ P.items[id] = r; changed = true; } }
  for(const id in P.items){ const r = o.items[id]; if(!r || (P.items[id].t||0) > (r.t||0)) localNewer = true; }
  for(const d in (o.log||{})){ const a = P.log[d] || {n:0,c:0}, b = o.log[d]; const m = {n:Math.max(a.n,b.n||0), c:Math.max(a.c,b.c||0)}; if(m.n !== a.n || m.c !== a.c){ P.log[d] = m; changed = true; } }
  for(const d in P.log){ if(!o.log || !o.log[d] || P.log[d].n > (o.log[d].n||0)) localNewer = true; }
  if(Array.isArray(o.recent) && (o.t||0) > (P.t||0)){ P.recent = o.recent.slice(-50); changed = true; }
  P.battles = P.battles || {};
  for(const k in (o.battles||{})) if(!P.battles[k]){ P.battles[k] = o.battles[k]; changed = true; }
  for(const k in P.battles) if(!o.battles || !o.battles[k]) localNewer = true;
  if(o.set && (o.t||0) > (P.t||0)) P.set = Object.assign(blank().set, o.set);
  if(localNewer) Cloud.schedule();
  return changed;
}
function computeStats(){
  const perf = {}; let tot = 0, pf = 0;
  ['L','N','E'].forEach(s => { const all = ITEMS.filter(it => it.s === s); const p = all.filter(it => lv(it.i) === 4).length; perf[s] = all.length ? Math.round(p / all.length * 1000) / 10 : 0; tot += all.length; pf += p; });
  perf.all = tot ? Math.round(pf / tot * 1000) / 10 : 0;
  let n = 0, c = 0; for(const d in P.log){ n += P.log[d].n || 0; c += P.log[d].c || 0; }
  const r = P.recent || []; const b = Object.values(P.battles || {});
  return {perf, n, acc: n ? Math.round(c / n * 1000) / 10 : 0, rn: r.length, recent: r.length ? Math.round(r.reduce((a, x) => a + x, 0) / r.length * 1000) / 10 : 0,
    bw: b.filter(x => x === 'w').length, bl: b.filter(x => x === 'l').length, bd: b.filter(x => x === 'd').length};
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ if(Cloud.dirty){ clearTimeout(Cloud.timer); Cloud.flush(); } }
  else if(Cloud.uid && !S.session) Cloud.pull();
});

/* ---------- pools ---------- */
function themeItems(ti){ return ITEMS.filter(it => it.t === ti); }
function subjItems(s, forQuiz){ return ITEMS.filter(it => it.s === s && (!forQuiz || it.k !== 'card')); }
function inScope(it, scope, done){
  const r = P.items[it.i]; const l = r ? r.l : 0;
  if(scope === 'new') return l === 0;
  if(scope === 'weak') return !!r && l >= 1 && l <= 2;
  if(scope === 'todo') return l < 4 || done;
  return true;
}
function buildPool(forQuiz){
  const st = P.set; const sel = st.themes[st.subj] || [];
  let pool = subjItems(st.subj, forQuiz);
  if(sel.length){ const set = new Set(sel); pool = pool.filter(it => set.has(it.t)); }
  pool = pool.filter(it => inScope(it, st.scope, st.done));
  if(st.scope !== 'todo' && !st.done) pool = pool.filter(it => lv(it.i) < 4 || st.scope === 'all');
  // 言語・英語：長文の中で1問でも条件に合えば、その長文の問題を全部出す
  if(st.subj !== 'N'){ const hit = new Set(pool.map(it => it.t)); pool = subjItems(st.subj, forQuiz).filter(it => hit.has(it.t)); }
  return pool;
}
// 言語・英語は1つの長文の問題をまとめ、長文の中は表の順番のまま出す（非言語は1問ずつ）
function groupPool(pool){
  const m = new Map();
  pool.forEach(it => { const key = it.s === 'N' ? 'n:' + it.i : 't:' + it.t; if(!m.has(key)) m.set(key, []); m.get(key).push(it); });
  const gs = [...m.values()];
  gs.forEach(g => g.sort((a, b) => IDX.get(a) - IDX.get(b)));
  return gs;
}
function orderPool(pool){
  const gs = groupPool(pool);
  if(P.set.order === 'order') return gs.sort((a, b) => IDX.get(a[0]) - IDX.get(b[0]));
  // ランダム：長文ごとに並べ替え、レベルの低い長文を少し優先（未学習は「まだ」と同じ扱い）
  const key = new Map(gs.map(g => { const avg = g.reduce((s, it) => { const l = lv(it.i); return s + (l === 0 ? 1 : l); }, 0) / g.length; return [g, avg + Math.random() * 2.2]; }));
  return gs.sort((a, b) => key.get(a) - key.get(b));
}

function barHTML(c, cls){ const tot = c.reduce((a,b)=>a+b,0) || 1; return '<div class="bar '+(cls||'')+'" role="img" aria-label="'+LV.map((n,i)=>n+' '+c[i]).join('、')+'">' + [4,3,2,1].map(i => c[i] ? '<b style="width:'+(c[i]/tot*100).toFixed(2)+'%;background:var(--lv'+i+')"></b>' : '').join('') + '</div>'; }

function shortQ(it){ const t = THEMES[it.t]; const q = it.k === 'g4' ? t.n : (it.q || t.n); return q.length > 36 ? q.slice(0, 35) + '…' : q; }

/* ---------- theme picker ---------- */
function openPicker(){
  const s = P.set.subj; const sel = new Set(P.set.themes[s] || []);
  const list = THEMES.map((t, i) => [t, i]).filter(([t]) => t.s === s);
  const groups = s === 'L' ? [['個別問（A/B/C）', list.filter(([t]) => !t.g)], ['まとめ回答（4問）', list.filter(([t]) => t.g)]] : [[s === 'N' ? '問題' : 'テーマ（長文）', list]];
  const rows = groups.map(([g, ls]) => '<div class="grp">'+g+'</div>' + ls.map(([t, i]) => {
    const c = levelCounts(themeItems(i));
    return '<label><input type="checkbox" data-ti="'+i+'" '+(sel.has(i)?'checked':'')+'><span class="id">'+esc(t.i.slice(1))+'</span><span>'+esc(t.n)+'</span>'+barHTML(c, 'mini')+'</label>';
  }).join('')).join('');
  dialog('<h2>'+SUBJ[s]+'のテーマを選ぶ</h2><div class="picker">'+rows+'</div>' +
    '<div class="row"><button type="button" class="btn ghost" id="pkNone">すべて外す</button><button type="button" class="btn primary" id="pkOk">決定</button></div>');
  document.getElementById('pkNone').onclick = () => $dlg.querySelectorAll('[data-ti]').forEach(c => c.checked = false);
  document.getElementById('pkOk').onclick = () => { P.set.themes[s] = [...$dlg.querySelectorAll('[data-ti]:checked')].map(c => +c.dataset.ti); save(); closeDlg(); renderHome(); };
}

/* ---------- dialogs ---------- */
function dialog(html){ $dlg.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><div class="box">'+html+'<button type="button" class="btn ghost" id="dlgClose">閉じる</button></div></div>'; document.getElementById('dlgClose').onclick = closeDlg; $dlg.querySelector('.dlg').onclick = e => { if(e.target.classList.contains('dlg')) closeDlg(); }; }
function closeDlg(){ $dlg.innerHTML = ''; }
function openExport(){
  const code = JSON.stringify({app:'gabmemo', v:2, exported:new Date().toISOString(), items:P.items, log:P.log, recent:P.recent, battles:P.battles});
  dialog('<h2>記録を書き出す</h2><p class="hint">下のコードをコピーするか、ファイルとして保存してください。</p><textarea id="exTxt" readonly>'+esc(code)+'</textarea><div class="row"><button type="button" class="btn primary" id="exCopy">コピーする</button><button type="button" class="btn ghost" id="exFile">ファイルで保存</button></div><p class="msg" id="exMsg"></p>');
  document.getElementById('exFile').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], {type:'application/json'})); a.download = 'gab-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); };
  document.getElementById('exCopy').onclick = async () => {
    const ta = document.getElementById('exTxt'); const m = document.getElementById('exMsg');
    try{ await navigator.clipboard.writeText(code); m.textContent = 'コピーしました。'; }
    catch(e){ ta.focus(); ta.select(); m.textContent = '自動コピーできませんでした。選択された文字を長押し（PCはCtrl+C）でコピーしてください。'; }
  };
}
function openImport(){
  dialog('<h2>記録を読み込む</h2><p class="hint">書き出したコードを貼り付けるか、保存したファイルを選んでください。「合わせる」は新しいほうの記録を残し、「置き換える」は今の記録を消して読み込みます。</p><textarea id="imTxt" placeholder="ここに貼り付け"></textarea><input type="file" id="imFile" accept=".txt,.json,text/plain,application/json"><div class="row"><button type="button" class="btn primary" id="imMerge">合わせる</button><button type="button" class="btn ghost" id="imReplace">置き換える</button></div><p class="msg" id="imMsg"></p>');
  document.getElementById('imFile').onchange = e => { const f = e.target.files[0]; if(!f) return; const fr = new FileReader(); fr.onload = () => document.getElementById('imTxt').value = fr.result; fr.readAsText(f); };
  const run = replace => {
    const m = document.getElementById('imMsg'); let o;
    try{ o = JSON.parse(document.getElementById('imTxt').value.trim()); }catch(e){ m.className = 'msg err'; m.textContent = 'コードを読み取れませんでした。書き出したコードを最初から最後までそのまま貼り付けてください。'; return; }
    if(!o || !o.items){ m.className = 'msg err'; m.textContent = 'GAB暗記ノートの記録ではないようです。'; return; }
    if(replace){ P.items = {}; P.log = {}; P.recent = []; P.battles = {}; }
    for(const id in o.items){ if(BYID[id]){ const l = P.items[id]; if(!l || (o.items[id].t||0) > (l.t||0)) P.items[id] = o.items[id]; } }
    for(const d in (o.log||{})){ const a = P.log[d] || {n:0,c:0}; P.log[d] = {n:Math.max(a.n, o.log[d].n||0), c:Math.max(a.c, o.log[d].c||0)}; }
    if(Array.isArray(o.recent) && !(P.recent||[]).length) P.recent = o.recent.slice(-50);
    for(const k in (o.battles||{})) if(!P.battles[k]) P.battles[k] = o.battles[k];
    save(); m.className = 'msg'; m.textContent = '読み込みました。'; renderHome();
  };
  document.getElementById('imMerge').onclick = () => run(false);
  document.getElementById('imReplace').onclick = () => run(true);
}
function openReset(){
  dialog('<h2>記録を消しますか？</h2><p>すべての科目のレベルと日付ごとの記録が消えます。'+'アカウントに保存された記録も消えます。'+'元に戻せないので、必要なら先に「書き出す」でバックアップしてください。</p><div class="row"><button type="button" class="btn" style="border-color:var(--ng);color:var(--ng)" id="rsOk">消す</button></div>');
  document.getElementById('rsOk').onclick = () => { P.items = {}; P.log = {}; P.recent = []; P.battles = {}; save(); closeDlg(); renderHome(); };
}

/* ---------- sessions ---------- */
function startSession(mode, pool, bangai){
  pool.forEach(it => delete it._ch);
  const gs = orderPool(pool); const n = P.set.count; let list = [];
  for(const g of gs){ if(!bangai && n && list.length >= n) break; list = list.concat(g); }
  if(!list.length) return;
  const gpos = []; for(let k = 0; k < list.length;){ let e = k; while(e < list.length && list[e].t === list[k].t && list[k].s !== 'N') e++; if(e === k) e = k + 1; for(let j = k; j < e; j++) gpos[j] = [j - k + 1, e - k]; k = e; }
  S.session = {mode, list, gpos, i:0, results:[], answered:false, flipped:false, pick:null, g4:[null,null,null,null]};
  S.view = 'study'; render(); window.scrollTo(0, 0);
}
function endSession(){ S.session = null; S.view = 'home'; render(); window.scrollTo(0, 0); }

function choicesFor(it){
  if(it._ch) return it._ch;
  const opts = it.a.concat(it.d || []);
  const letters = opts.every(o => /^[A-E]$/.test(o));
  it._ch = letters ? opts.slice().sort() : shuffle(opts);
  return it._ch;
}
function marks(l){ return '<span class="marks" title="'+LV[l]+'">' + [1,2,3,4].map(k => '<i class="'+(l >= k ? 'on' : '')+'"></i>').join('') + '</span>'; }
function metaHTML(it){
  const t = THEMES[it.t]; const l = lv(it.i);
  const ss = S.session; const gp = ss && ss.gpos && ss.list[ss.i] === it ? ss.gpos[ss.i] : null;
  return '<div class="qmeta"><span class="id">'+SUBJ[it.s]+' '+esc(dispId(it))+'</span>' + (gp && gp[1] > 1 ? '<span class="chip lv">この長文 '+gp[0]+' / '+gp[1]+'問</span>' : '') + marks(l) + '<span>'+LV[l]+'</span>' +
    (it.st ? '<span class="chip warn">'+(it.st===3?'答えが割れている':it.st===2?'1件のみ':'迷い・別解あり')+'</span>' : '') +
    (it.k === 'card' ? '<span class="chip lv">番外編</span>' : '') + '</div>';
}
function themeLine(it){ const t = THEMES[it.t]; if(it.s === 'N') return ''; return '<div class="theme">'+esc(t.n)+'</div>'; }
function promptHTML(it){
  const t = THEMES[it.t];
  if(it.k === 'g4') return '<div class="qtext">このテーマの4問の答えは？</div>';
  if(it.s === 'N') return '<div class="qtext">'+esc(t.n)+'</div>';
  return '<div class="qtext'+(isEN(it)?' en':'')+'" lang="'+(isEN(it)?'en':'ja')+'">'+esc(it.q || '（問題文なし）')+'</div>';
}
function relHTML(it){
  const t = THEMES[it.t]; if(!t.rel) return '';
  const names = t.rel.ids.map(id => { const x = THEMES.find(tt => tt.i === id); return x ? id.slice(1)+'「'+x.n+'」' : id; }).join('、');
  return '<div class="rel"><b>関連テーマ：</b>'+esc(names)+'<br>'+esc(t.rel.nt)+'</div>';
}
function answerText(it){
  if(it.k === 'g4') return it.a.join(' または ');
  if(it.s === 'L' && it.k !== 'card') return it.a.map(a => a+'（'+ABC[a][0]+'）').join(' または ');
  return it.a.join(' ／ ');
}
function detailHTML(it){
  const t = THEMES[it.t]; let h = '';
  if(it.st && it.v && it.v.length){
    h += '<div class="split"><h3>⚠ '+STLBL[it.st]+'</h3><table>' + it.v.map(([k, v]) => '<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('') + '</table>' +
      (it.a.length > 1 ? '<p class="note" style="margin:6px 0 0">どれを選んでも正解にしています。</p>' : '') + '</div>';
  }
  if(it.gl) h += '<p class="note"><b>訳：</b>'+esc(it.gl)+'</p>';
  if(it.nt) h += '<p class="note"><b>メモ：</b>'+esc(it.nt)+'</p>';
  if(t.tn) h += '<p class="note"><b>テーマ：</b>'+esc(t.tn)+'</p>';
  const al = (it.al || []).concat(it.s !== 'N' ? (t.al || []) : []);
  if(al.length) h += '<p class="note"><b>別の解答集での表記：</b>'+esc(al.slice(0, 4).join(' ／ '))+'</p>';
  h += relHTML(it);
  return h ? '<div class="detail">'+h+'</div>' : '';
}

function renderStudy(){
  const ss = S.session; const it = ss.list[ss.i];
  const pct = ss.i / ss.list.length * 100;
  let body = '';
  const battle = ss.mode === 'battle';
  const top = '<div class="sbar">'+(battle ? '<span class="chip warn">対決 '+esc(B.code||'')+'</span>' : '')+'<span class="count">'+(ss.i+1)+' / '+ss.list.length+'</span><div class="prog"><b style="width:'+pct+'%"></b></div><button type="button" class="quit" id="quit">'+(battle?'棄権':'やめる')+'</button></div>';
  if(ss.mode !== 'card') body = quizHTML(it, ss); else body = cardHTML(it, ss);
  $app.innerHTML = '<div class="study">'+top+(battle ? '<div id="liveBoard" class="live"></div>' : '')+body+'</div>';
  document.getElementById('quit').onclick = () => battle ? battleQuit() : finish(true);
  bindStudy(it, ss);
  if(battle) renderLive();
}

function quizHTML(it, ss){
  let ch = '';
  if(it.k === 'abc'){
    ch = '<div class="choices abc">' + ['A','B','C'].map((L, k) => {
      let cls = ''; if(ss.answered){ if(it.a.includes(L)) cls = 'right'; else if(ss.pick === L) cls = 'wrong'; } else if(ss.pick === L) cls = 'sel';
      return '<button type="button" class="choice '+cls+'" data-pick="'+L+'" '+(ss.answered?'disabled':'')+'><span class="bub">'+L+'</span><span class="lbl"><b>'+ABC[L][0]+'</b><small>'+ABC[L][1]+'</small></span></button>';
    }).join('') + '</div>';
  } else if(it.k === 'g4'){
    const best = ss.answered ? bestG4(it, ss.g4) : null;
    ch = '<div class="g4">' + [0,1,2,3].map(r => '<div class="g4row"><span class="n">問'+(r+1)+'</span>' + ['A','B','C'].map(L => {
      let cls = ''; const mine = ss.g4[r] === L;
      if(ss.answered){ const right = best[r] === L; cls = right && mine ? 'right' : mine ? 'wrong' : right ? 'miss' : ''; } else if(mine) cls = 'sel';
      return '<button type="button" class="'+cls+'" data-g4="'+r+'" data-v="'+L+'" '+(ss.answered?'disabled':'')+' aria-label="問'+(r+1)+' '+L+'">'+L+'</button>';
    }).join('') + '</div>').join('') + '</div>';
  } else {
    const opts = choicesFor(it);
    ch = '<div class="choices">' + opts.map((o, k) => {
      let cls = ''; if(ss.answered){ if(it.a.includes(o)) cls = 'right'; else if(ss.pick === o) cls = 'wrong'; }
      return '<button type="button" class="choice '+cls+'" data-pick="'+esc(o)+'" '+(ss.answered?'disabled':'')+' lang="'+(isEN(it)?'en':'ja')+'"><span class="bub">'+(k+1)+'</span><span class="lbl">'+esc(o)+'</span></button>';
    }).join('') + '</div>';
  }
  let fb = '', act = '';
  if(ss.answered){
    const r = ss.results[ss.results.length - 1];
    fb = '<div class="fb '+(r.ok?'ok':'ng')+'" role="status"><div class="head"><strong>'+(r.ok?'正解':'不正解')+'</strong><span class="lvchg">'+LV[r.from]+' → '+LV[r.to]+'</span></div>' +
      '<div class="ans"><span class="k">正解</span>'+esc(answerText(it))+'</div>' + detailHTML(it) + '</div>';
    act = '<div class="actions"><button type="button" class="btn primary" id="next">'+(ss.i + 1 < ss.list.length ? '次の問題' : '結果を見る')+'</button><div class="kbd"><kbd>Enter</kbd> で次へ</div></div>';
  } else if(it.k === 'g4'){
    act = '<div class="actions"><button type="button" class="btn primary" id="check" '+(ss.g4.every(Boolean)?'':'disabled')+'>答え合わせ</button><div class="kbd"><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd> を4回打つと答え合わせ</div></div>';
  } else {
    act = '<div class="actions"><div class="kbd">'+(it.k === 'abc' ? '<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd> または <kbd>1</kbd>〜<kbd>3</kbd>' : '<kbd>1</kbd>〜<kbd>'+choicesFor(it).length+'</kbd>')+' で回答</div></div>';
  }
  return '<div class="qcard">'+metaHTML(it)+themeLine(it)+promptHTML(it)+(ss.answered?'':relHTML(it))+'</div>' + ch + fb + act;
}
function bestG4(it, mine){
  let best = it.a[0], bs = -1;
  it.a.forEach(s => { const sc = [0,1,2,3].filter(r => s[r] === mine[r]).length; if(sc > bs){ bs = sc; best = s; } });
  return best;
}
function answerQuiz(it, pick){
  const ss = S.session; if(ss.answered) return;
  let ok;
  if(it.k === 'g4'){ const s = ss.g4.join(''); ok = it.a.includes(s); }
  else { ok = it.a.includes(pick); ss.pick = pick; }
  const [from, to] = applyQuiz(it, ok);
  ss.results.push({id:it.i, ok, from, to, pick: it.k === 'g4' ? ss.g4.join('') : pick});
  ss.answered = true;
  if(ss.mode === 'battle') battleReport(ss);
  renderStudy();
  const fb = $app.querySelector('.fb'); if(fb && fb.getBoundingClientRect().top > window.innerHeight * .6) fb.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

function cardHTML(it, ss){
  let back = '';
  if(ss.flipped){
    const big = it.k === 'g4' ? '<div class="big mono">'+esc(it.a.join(' / '))+'</div>' : '<div class="big" lang="'+(isEN(it)?'en':'ja')+'">'+esc(answerText(it))+'</div>';
    back = '<div class="back">'+big+detailHTML(it)+'</div>';
  }
  const front = '<div class="qcard flip" id="flip" role="button" tabindex="0" aria-label="カードをめくる">'+metaHTML(it)+themeLine(it)+promptHTML(it)+(ss.flipped ? back : relHTML(it) + '<div class="tap">タップして答えを見る</div>')+'</div>';
  const act = ss.flipped
    ? '<div class="actions"><div class="rate"><button type="button" class="btn r1" data-rate="1">わからない</button><button type="button" class="btn r2" data-rate="2">うろ覚え</button><button type="button" class="btn r3" data-rate="3">覚えた</button></div><div class="kbd"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> で判定</div></div>'
    : '<div class="actions"><button type="button" class="btn primary" id="doFlip">答えを見る</button><div class="kbd"><kbd>Space</kbd> でめくる</div></div>';
  return front + act;
}
function rateCard(it, g){
  const ss = S.session; const [from, to] = applyCard(it, g);
  ss.results.push({id:it.i, ok: g === 3, from, to, grade:g}); next();
}
function next(){
  const ss = S.session;
  if(ss.i + 1 >= ss.list.length){ if(ss.mode === 'battle'){ battleFinished(); return; } finish(false); return; }
  ss.i++; ss.answered = false; ss.flipped = false; ss.pick = null; ss.g4 = [null,null,null,null];
  renderStudy(); window.scrollTo(0, 0);
}
function finish(early){
  const ss = S.session;
  if(!ss.results.length){ endSession(); return; }
  S.view = 'result'; render(); window.scrollTo(0, 0);
}

function bindStudy(it, ss){
  $app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answerQuiz(it, b.dataset.pick));
  $app.querySelectorAll('[data-g4]').forEach(b => b.onclick = () => { ss.g4[+b.dataset.g4] = b.dataset.v; renderStudy(); });
  const ck = document.getElementById('check'); if(ck) ck.onclick = () => answerQuiz(it);
  const nx = document.getElementById('next'); if(nx) nx.onclick = next;
  const fl = document.getElementById('flip'); if(fl && !ss.flipped) fl.onclick = () => { ss.flipped = true; renderStudy(); };
  const df = document.getElementById('doFlip'); if(df) df.onclick = () => { ss.flipped = true; renderStudy(); };
  $app.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => rateCard(it, +b.dataset.rate));
}
document.addEventListener('keydown', e => {
  if(S.view !== 'study' || $dlg.innerHTML || e.metaKey || e.ctrlKey || e.altKey) return;
  const ss = S.session; const it = ss.list[ss.i]; const k = e.key;
  if(ss.mode !== 'card'){
    if(ss.answered){ if(k === 'Enter' || k === ' '){ e.preventDefault(); next(); } return; }
    if(it.k === 'abc'){ const m = {a:'A',b:'B',c:'C','1':'A','2':'B','3':'C'}[k.toLowerCase()]; if(m){ e.preventDefault(); answerQuiz(it, m); } }
    else if(it.k === 'g4'){
      const m = {a:'A',b:'B',c:'C','1':'A','2':'B','3':'C'}[k.toLowerCase()];
      if(m){ e.preventDefault(); const r = ss.g4.indexOf(null); if(r >= 0){ ss.g4[r] = m; if(r === 3) answerQuiz(it); else renderStudy(); } }
      else if(k === 'Backspace'){ const r = ss.g4.indexOf(null); const last = r < 0 ? 3 : r - 1; if(last >= 0){ ss.g4[last] = null; renderStudy(); } }
    } else { const n = parseInt(k, 10); const opts = choicesFor(it); if(n >= 1 && n <= opts.length){ e.preventDefault(); answerQuiz(it, opts[n-1]); } }
  } else {
    if(!ss.flipped){ if(k === ' ' || k === 'Enter'){ e.preventDefault(); ss.flipped = true; renderStudy(); } }
    else { const g = {'1':1,'2':2,'3':3}[k]; if(g){ e.preventDefault(); rateCard(it, g); } }
  }
});

/* ---------- result ---------- */
function renderResult(){
  const ss = S.session; const res = ss.results;
  const ok = res.filter(r => r.ok).length;
  const quiz = ss.mode === 'quiz';
  const missed = res.filter(r => !r.ok).map(r => BYID[r.id]);
  const up = res.filter(r => r.to > r.from).length, perfect = res.filter(r => r.to === 4 && r.from < 4).length;
  $app.innerHTML = '<div class="study">' +
    '<section class="qcard"><div class="qmeta"><span class="id">'+(quiz?'クイズ':'暗記カード')+'の結果</span><span>'+today()+'</span></div>' +
      '<div class="score">'+ok+'<small> / '+res.length+(quiz?' 正解':' 覚えた')+'</small></div>' +
      '<p class="note">レベルが上がった問題 <b>'+up+'</b>　新しく完璧になった問題 <b>'+perfect+'</b></p></section>' +
    (missed.length ? '<section class="panel"><h2>'+(quiz?'間違えた問題':'「わからない」「うろ覚え」にした問題')+'</h2><ul class="missed">' + missed.map(it => '<li><span class="id">'+SUBJ[it.s]+' '+esc(dispId(it))+'</span><span>'+esc(shortQ(it))+'</span><span class="note">正解：'+esc(answerText(it))+'</span></li>').join('') + '</ul></section>' : '') +
    '<div class="actions">' + (missed.length ? '<button type="button" class="btn mark" id="again">'+(quiz?'間違えた問題だけもう一度':'この問題だけもう一度')+'</button>' : '') +
      '<button type="button" class="btn primary" id="home">ホームに戻る</button></div></div>';
  const ag = document.getElementById('again'); if(ag) ag.onclick = () => { missed.forEach(it => delete it._ch); startSession(ss.mode, missed, true); };
  document.getElementById('home').onclick = endSession;
}

function render(){
  setNav();
  if(S.view === 'study' && S.session) renderStudy();
  else if(S.view === 'result' && S.session) renderResult();
  else if(S.view === 'rank') renderRank();
  else if(S.view === 'battle') renderBattle();
  else if(S.view === 'settings') renderSettings();
  else { S.view = 'home'; renderHome(); }
}
/* ---------- account / nav ---------- */
const ME = {uid:null, email:'', name:'', public:true, owner:false, invite:''};
function setNav(){
  const nav = document.getElementById('nav');
  const on = !!ME.name && ITEMS.length > 0;
  nav.hidden = !on;
  if(!on) return;
  const cur = (S.view === 'study' || S.view === 'result') ? (S.session && S.session.mode === 'battle' ? 'battle' : 'home') : S.view;
  nav.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === cur ? 'page' : 'false'));
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if(!b) return;
  const go = b.dataset.nav;
  if(S.session && S.session.mode === 'battle'){
    if(go !== 'battle'){ flash('対決中です。「棄権」してから移動してください。'); return; }

  }
  if(B.code && B.phase !== 'menu' && go !== 'battle'){ flash('対決の部屋に入っています。「部屋を出る」を押してから移動してください。'); return; }
  S.session = null; S.view = go; render(); window.scrollTo(0, 0);
});
function flash(msg){ const el = document.getElementById('flash'); el.textContent = msg; el.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(() => el.hidden = true, 3500); }

function gate(html){ document.getElementById('nav').hidden = true; $app.innerHTML = '<div class="gate panel">'+html+'</div>'; }
function showLoading(msg){ gate('<p class="empty">'+esc(msg)+'</p>'); }
function showLogin(err){
  document.getElementById('sync').hidden = true;

function showNoData(){

async function loadContent(){
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem('gab.content') || 'null'); }catch(e){}
  try{
    const snap = await FB.getDoc(FB.doc(db, 'content', 'bundle'));
    if(!snap.exists()) return false;
    const d = snap.data();
    if(cache && cache.v === d.v){ setData(JSON.parse(cache.json)); return true; }
    setData(JSON.parse(d.json));
    try{ localStorage.setItem('gab.content', JSON.stringify({v:d.v, json:d.json})); }catch(e){}
    return true;
  }catch(e){
    console.error(e);
    if(cache){ setData(JSON.parse(cache.json)); return true; }
    throw e;
  }
}
async function afterAuth(u){
  if(!u){ ME.uid = null; Cloud.uid = null; showLogin(); return; }
  ME.uid = u.uid; ME.email = u.email || '';

/* ---------- ranking ---------- */
const RK = {metric:'perf', sub:'all', rows:null, loading:false, err:''};
const METRIC = {perf:'完璧の割合', acc:'正答率', recent:'直近50問の正答率', win:'対決の勝率'};
function metricVal(st, m, sub){
  if(!st) return null;
  if(m === 'perf') return st.perf ? st.perf[sub] : null;
  if(m === 'acc') return st.n ? st.acc : null;
  if(m === 'recent') return st.rn ? st.recent : null;
  const g = (st.bw||0) + (st.bl||0) + (st.bd||0); return g ? Math.round(st.bw / g * 1000) / 10 : null;
}
function metricSub(st, m){
  if(!st) return '';
  if(m === 'acc') return (st.n||0) + '問';
  if(m === 'recent') return (st.rn||0) + '問';
  if(m === 'win') return (st.bw||0)+'勝 '+(st.bl||0)+'敗'+(st.bd?' '+st.bd+'分':'');
  return '';
}
async function loadRank(){
  RK.loading = true; RK.err = ''; renderRank();
  try{
    const qs = await FB.getDocs(FB.query(FB.collection(db, 'profiles'), FB.where('public', '==', true)));
    RK.rows = qs.docs.map(d => Object.assign({uid:d.id}, d.data()));
  }catch(e){ console.error(e); RK.err = 'ランキングを読み込めませんでした。'; RK.rows = []; }
  RK.loading = false; if(S.view === 'rank') renderRank();
}
function renderRank(){
  if(RK.rows === null && !RK.loading){ loadRank(); return; }
  const mine = {uid:ME.uid, name:ME.name, public:ME.public, stats:computeStats()};
  let rows = (RK.rows || []).filter(r => r.uid !== ME.uid);
  if(ME.public) rows.push(mine);
  rows = rows.map(r => Object.assign({v:metricVal(r.stats, RK.metric, RK.sub)}, r));
  rows.sort((a, b) => (b.v == null ? -1 : b.v) - (a.v == null ? -1 : a.v) || ((b.stats||{}).n||0) - ((a.stats||{}).n||0));
  let rank = 0, prev = undefined;
  const list = rows.map((r, k) => { if(r.v !== prev){ rank = k + 1; prev = r.v; } const me = r.uid === ME.uid;
    return '<li class="'+(me?'me':'')+'"><span class="rk mono">'+(r.v == null ? '–' : rank)+'</span><span class="nm">'+esc(r.name || '名無し')+(me?' <small>（あなた）</small>':'')+'</span><span class="sb">'+esc(metricSub(r.stats, RK.metric))+'</span><span class="vl mono">'+(r.v == null ? '–' : r.v.toFixed(1)+'%')+'</span></li>'; }).join('');
  const myv = metricVal(mine.stats, RK.metric, RK.sub);
  $app.innerHTML = '<div class="study">' +
    '<section class="panel"><h2>ランキング <span class="mono">RANKING</span></h2>' +
      seg('rkm', Object.entries(METRIC), RK.metric) +
      (RK.metric === 'perf' ? '<div style="margin-top:8px">'+seg('rks', [['all','合計'],['L','言語'],['N','非言語'],['E','英語']], RK.sub)+'</div>' : '') +
      (RK.loading ? '<p class="empty">読み込み中…</p>' : RK.err ? '<p class="msg err">'+esc(RK.err)+'</p>' : '<ol class="board">'+(list || '<li class="empty">まだ誰も公開していません。</li>')+'</ol>') +
      (!ME.public ? '<p class="note">あなたは非公開なので、ランキングには出ていません。あなたの値：<b>'+(myv == null ? '–' : myv.toFixed(1)+'%')+'</b> '+esc(metricSub(mine.stats, RK.metric))+'</p>' : '') +
      '<div class="tools" style="margin-top:12px"><button type="button" class="btn ghost" id="rkReload">最新にする</button><button type="button" class="btn ghost" id="rkSet">公開設定を変える</button></div>' +
    '</section></div>';
  $app.querySelectorAll('[data-set="rkm"]').forEach(b => b.onclick = () => { RK.metric = b.dataset.v; renderRank(); });
  $app.querySelectorAll('[data-set="rks"]').forEach(b => b.onclick = () => { RK.sub = b.dataset.v; renderRank(); });
  document.getElementById('rkReload').onclick = loadRank;
  document.getElementById('rkSet').onclick = () => { S.view = 'settings'; render(); };
}

/* ---------- battle ---------- */
const B = {code:null, room:null, players:[], unsubR:null, unsubP:null, phase:'menu', countTimer:null, err:'', subj:'L', n:10};
const CODECH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function roomRef(code){ return FB.doc(db, 'rooms', code); }
function playerRef(code, uid){ return FB.doc(db, 'rooms', code, 'players', uid); }
function battleQuestions(subj, n){
  const gs = shuffle(groupPool(subjItems(subj, true)));
  let list = []; for(const g of gs){ if(list.length >= n) break; list = list.concat(g); }
  return list.map(it => it.i);
}
async function battleCreate(){
  B.err = '';
  try{
    let code = '';
    for(let k = 0; k < 5; k++){ code = Array.from({length:5}, () => CODECH[Math.floor(Math.random() * CODECH.length)]).join(''); if(!(await FB.getDoc(roomRef(code))).exists()) break; }
    await FB.setDoc(roomRef(code), {host:ME.uid, hostName:ME.name, subj:B.subj, n:B.n, qids:battleQuestions(B.subj, B.n), state:'lobby', startAt:0, created:Date.now()});
    await battleJoin(code);
  }catch(e){ console.error(e); B.err = '部屋を作れませんでした。'; renderBattle(); }
}
async function battleJoin(code){
  code = (code || '').trim().toUpperCase(); B.err = '';
  if(!code){ B.err = '合言葉を入力してください。'; renderBattle(); return; }
  try{
    const r = await FB.getDoc(roomRef(code));
    if(!r.exists()){ B.err = 'その合言葉の部屋は見つかりませんでした。'; renderBattle(); return; }
    const d = r.data();
    if(d.state !== 'lobby' && d.host !== ME.uid){ B.err = 'その部屋はもう始まっています。'; renderBattle(); return; }
    await FB.setDoc(playerRef(code, ME.uid), {name:ME.name, idx:0, score:0, ms:0, done:false, at:Date.now()});
    battleListen(code);
  }catch(e){ console.error(e); B.err = '参加できませんでした。'; renderBattle(); }
}
function battleListen(code){
  battleUnsub(); B.code = code; B.phase = 'lobby'; B.room = null; B.players = [];
  B.unsubR = FB.onSnapshot(roomRef(code), snap => {
    if(!snap.exists()) return;
    const prev = B.room; B.room = snap.data();
    if(B.room.state === 'playing' && (!prev || prev.state !== 'playing') && B.phase === 'lobby') battleBegin();
    if(B.room.state === 'done' && B.phase !== 'result'){ battleResult(); return; }
    if(S.view === 'battle') renderBattle();
  }, e => { console.error(e); B.err = '部屋との接続が切れました。'; });
  B.unsubP = FB.onSnapshot(FB.collection(db, 'rooms', code, 'players'), qs => {
    B.players = qs.docs.map(d => Object.assign({uid:d.id}, d.data()));
    if(B.room && B.room.host === ME.uid && B.room.state === 'playing' && B.players.length && B.players.every(p => p.done)) FB.updateDoc(roomRef(code), {state:'done'}).catch(() => {});
    if(S.view === 'study' && S.session && S.session.mode === 'battle') renderLive();
    else if(S.view === 'battle') renderBattle();
  }, e => console.error(e));
}
function battleUnsub(){ if(B.unsubR) B.unsubR(); if(B.unsubP) B.unsubP(); B.unsubR = B.unsubP = null; clearInterval(B.countTimer); }
function battleLeave(){ battleUnsub(); B.code = null; B.room = null; B.players = []; B.phase = 'menu'; if(S.session && S.session.mode === 'battle') S.session = null; }
function battleBegin(){
  const list = B.room.qids.map(id => BYID[id]).filter(Boolean);
  list.forEach(it => delete it._ch);
  const gpos = []; for(let k = 0; k < list.length;){ let e = k; while(e < list.length && list[e].t === list[k].t && list[k].s !== 'N') e++; if(e === k) e = k + 1; for(let j = k; j < e; j++) gpos[j] = [j - k + 1, e - k]; k = e; }
  S.session = {mode:'battle', list, gpos, i:0, results:[], answered:false, flipped:false, pick:null, g4:[null,null,null,null], score:0};
  B.phase = 'count'; S.view = 'battle'; render();
  clearInterval(B.countTimer);
  B.countTimer = setInterval(() => {
    const left = B.room.startAt - Date.now();
    const el = document.getElementById('countNum'); if(el) el.textContent = Math.max(1, Math.ceil(left / 1000));
    if(left <= 0){ clearInterval(B.countTimer); B.phase = 'play'; S.view = 'study'; render(); window.scrollTo(0, 0); }
  }, 100);
}
function battleReport(ss){
  ss.score = ss.results.filter(r => r.ok).length;
  FB.updateDoc(playerRef(B.code, ME.uid), {idx:ss.i + 1, score:ss.score, ms:Math.max(0, Date.now() - B.room.startAt)}).catch(e => console.error(e));
}
function battleFinished(){
  // 最後の解説を読み終えて「結果を見る」を押した時点で完了にする（タイムは最後に答えた時点）
  FB.updateDoc(playerRef(B.code, ME.uid), {done:true}).catch(e => console.error(e));
  B.phase = 'wait'; S.view = 'battle'; render(); window.scrollTo(0, 0);
}
function battleQuit(){
  const ss = S.session;
  if(ss && ss.mode === 'battle'){ FB.updateDoc(playerRef(B.code, ME.uid), {done:true, quit:true, ms:Math.max(0, Date.now() - B.room.startAt), idx:ss.results.length, score:ss.results.filter(r => r.ok).length}).catch(() => {}); }
  B.phase = 'wait'; S.view = 'battle'; render(); window.scrollTo(0, 0);
}
function rankPlayers(ps){
  return ps.slice().sort((a, b) => (b.score - a.score) || ((b.done && !b.quit ? 1 : 0) - (a.done && !a.quit ? 1 : 0)) || (a.ms - b.ms));
}
function battleResult(){
  clearInterval(B.countTimer);
  B.phase = 'result';
  if(S.session && S.session.mode === 'battle') S.session = null;
  S.view = 'battle'; render(); window.scrollTo(0, 0);
  setTimeout(battleRecord, 1500);
}
function battleRecord(){
  if(!B.code || B.phase !== 'result' || P.battles[B.code]) return;
  const ps = rankPlayers(B.players);
  if(ps.length < 2) return;
  const top = ps[0]; const ties = ps.filter(p => p.score === top.score && p.ms === top.ms && !!p.quit === !!top.quit);
  if(!ps.some(p => p.uid === ME.uid)) return;
  P.battles[B.code] = ties.length > 1 && ties.some(p => p.uid === ME.uid) ? 'd' : top.uid === ME.uid ? 'w' : 'l';
  save(); if(S.view === 'battle') renderBattle();
}
function fmtMs(ms){ const s = ms / 1000; return s < 60 ? s.toFixed(1) + '秒' : Math.floor(s / 60) + '分' + String(Math.round(s % 60)).padStart(2, '0') + '秒'; }
function boardHTML(final){
  const n = B.room ? B.room.qids.length : 0;
  const ps = final ? rankPlayers(B.players) : B.players.slice().sort((a, b) => (b.score - a.score) || (b.idx - a.idx));
  return '<ol class="board">' + ps.map((p, k) => '<li class="'+(p.uid===ME.uid?'me':'')+'"><span class="rk mono">'+(final ? k + 1 : '')+'</span><span class="nm">'+esc(p.name || '名無し')+(p.uid===ME.uid?' <small>（あなた）</small>':'')+(B.room && p.uid === B.room.host ? ' <small>ホスト</small>' : '')+'</span>' +
    '<span class="sb">'+(p.quit ? '棄権' : p.done ? '完了 '+fmtMs(p.ms) : B.room && B.room.state === 'lobby' ? '待機中' : p.idx+' / '+n+'問')+'</span><span class="vl mono">'+(p.score||0)+'正解</span></li>').join('') + '</ol>';
}
function renderLive(){ const el = document.getElementById('liveBoard'); if(el) el.innerHTML = boardHTML(false); }
function renderBattle(){
  const host = B.room && B.room.host === ME.uid;
  let h = '';
  if(!B.code){
    h = '<section class="panel"><h2>リアルタイム対決 <span class="mono">BATTLE</span></h2><p class="hint" style="margin:0 0 10px">部屋を作って合言葉を友達に伝えると、全員に同じ問題が同時に出ます。正解数が多い人の勝ち、同点なら早く解き終えた人の勝ちです。対決で答えた問題もレベルに反映されます。</p>' +
      '<h3 class="sub">部屋を作る</h3><div class="opt"><label class="l">科目</label>'+seg('bs', [['L','言語'],['N','非言語'],['E','英語']], B.subj)+'</div>' +
      '<div class="opt" style="margin-top:8px"><label class="l">問題数'+(B.subj !== 'N' ? '（長文単位なので少し増えることがあります）' : '')+'</label>'+seg('bn', [[5,'5'],[10,'10'],[20,'20']], B.n)+'</div>' +
      '<button type="button" class="btn primary" id="bCreate" style="margin-top:12px;width:100%">部屋を作る</button>' +
      '<h3 class="sub" style="margin-top:20px">部屋に入る</h3><div class="row"><input id="bCode" class="input mono" maxlength="5" placeholder="合言葉（5文字）" autocomplete="off" autocapitalize="characters"><button type="button" class="btn" id="bJoin">入る</button></div>' +
      (B.err ? '<p class="msg err">'+esc(B.err)+'</p>' : '') + '</section>';
  } else if(B.phase === 'lobby'){
    const r = B.room;
    h = '<section class="panel"><h2>対決の部屋</h2><p class="note">合言葉</p><div class="roomcode mono">'+esc(B.code)+'</div>' +
      '<p class="hint">この合言葉を友達に伝えて、「対決」→「部屋に入る」から入ってもらってください。</p>' +
      (r ? '<p class="note">科目：<b>'+SUBJ[r.subj]+'</b>　問題数：<b>'+r.qids.length+'問</b>　ホスト：<b>'+esc(r.hostName)+'</b></p>' : '<p class="empty">読み込み中…</p>') +
      '<h3 class="sub">参加者（'+B.players.length+'人）</h3>' + boardHTML(false) +
      (host ? '<button type="button" class="btn primary" id="bStart" style="width:100%;margin-top:12px">スタート</button>'+(B.players.length < 2 ? '<p class="hint">1人でも始められますが、勝敗は記録されません。</p>' : '') : '<p class="empty" style="margin-top:12px">ホストがスタートするのを待っています…</p>') +
      '<button type="button" class="btn ghost" id="bLeave" style="width:100%;margin-top:8px">部屋を出る</button></section>';
  } else if(B.phase === 'count'){
    h = '<section class="panel center"><p class="note">まもなく開始</p><div class="countdown mono" id="countNum">3</div><p class="hint">'+SUBJ[B.room.subj]+'・'+B.room.qids.length+'問</p></section>';
  } else if(B.phase === 'wait'){
    h = '<section class="panel"><h2>解き終わりました</h2><p class="hint">全員が終わると結果が出ます。</p>' + boardHTML(false) +
      (host ? '<button type="button" class="btn mark" id="bClose" style="width:100%;margin-top:12px">ここで締め切って結果を出す</button>' : '') + '</section>';
  } else if(B.phase === 'result'){
    const ps = rankPlayers(B.players); const my = P.battles[B.code];
    h = '<section class="panel"><h2>対決の結果</h2>' +
      (my ? '<div class="verdict '+my+'">'+({w:'勝ち', l:'負け', d:'引き分け'})[my]+'</div>' : ps.length < 2 ? '<p class="hint">1人だったので勝敗は記録していません。</p>' : '') +
      boardHTML(true) + '<button type="button" class="btn primary" id="bLeave" style="width:100%;margin-top:12px">部屋を出る</button></section>';
  }
  $app.innerHTML = '<div class="study">' + h + '</div>';
  $app.querySelectorAll('[data-set="bs"]').forEach(b => b.onclick = () => { B.subj = b.dataset.v; renderBattle(); });
  $app.querySelectorAll('[data-set="bn"]').forEach(b => b.onclick = () => { B.n = +b.dataset.v; renderBattle(); });
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('bCreate', battleCreate);
  on('bJoin', () => battleJoin(document.getElementById('bCode').value));
  on('bLeave', () => { battleLeave(); renderBattle(); });
  on('bStart', () => { FB.updateDoc(roomRef(B.code), {state:'playing', startAt:Date.now() + 3500}).catch(e => { console.error(e); flash('スタートできませんでした。'); }); });
  on('bClose', () => FB.updateDoc(roomRef(B.code), {state:'done'}).catch(() => {}));
}

/* ---------- start ---------- */
FB.getRedirectResult(auth).catch(e => { if(e && e.code) showLogin('ログインに失敗しました（'+e.code+'）'); });
FB.onAuthStateChanged(auth, u => { afterAuth(u); });


</script>
</body>
